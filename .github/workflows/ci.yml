name: CI

# The only automated gate. There is deliberately no deploy job: images are built and
# rolled out by hand (see docs/engineering/deploy-sector137.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build · Typecheck · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node, not Bun, runs and builds the app: better-sqlite3 links a Node-ABI native
      # binary Bun cannot load. 22 matches the Dockerfile; posthog-node needs >=22.22,
      # which the floating "22" resolves to.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Bun only drives the pure-function unit tests (`bun test src`).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install
        run: npm ci

      # Build BEFORE typecheck: src/routeTree.gen.ts is gitignored and generated by the
      # Vite build, and without it every route's typed path fails to resolve.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
